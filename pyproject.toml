[project]
name = "advantage-player"
version = "0.1.0"
description = "Edge-gated, fractional-Kelly Binance USDⓈ-M futures bot"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16",
    "pyyaml>=6",
    "uvloop>=0.19; sys_platform == 'linux'",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[project.scripts]
advantage-player = "advantage_player.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advantage_player"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC110"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "uvloop"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs DEMO API keys / network (skipped if absent)"]
